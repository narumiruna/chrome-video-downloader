<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Captured stream fixture</title>
  </head>
  <body>
    <main>
      <h1>Captured stream fixture</h1>
      <p>Loads separate fragmented MP4 video and audio tracks.</p>
    </main>
    <script>
      const parts = [
        "/captured/playlist.json",
        "/captured/video/chunk-stream0-00002.m4s",
        "/captured/audio/chunk-stream1-00003.m4s",
        "/captured/video/chunk-stream0-00001.m4s",
        "/captured/audio/chunk-stream1-00001.m4s",
        "/captured/audio/chunk-stream1-00002.m4s",
      ];

      Promise.all(
        parts.map(async (path) => {
          const response = await fetch(path);
          if (!response.ok) throw new Error(`Failed to load ${path}`);
          await response.arrayBuffer();
        }),
      ).then(() => {
        document.documentElement.dataset.streamLoaded = "true";

        const video = document.createElement("video");
        let currentTime = 1;
        let ended = false;
        Object.defineProperties(video, {
          currentTime: { configurable: true, get: () => currentTime },
          duration: { configurable: true, get: () => 3 },
          ended: { configurable: true, get: () => ended },
          paused: { configurable: true, get: () => ended },
        });
        document.body.append(video);
        setTimeout(() => {
          video.dispatchEvent(new Event("play"));
          video.dispatchEvent(new Event("timeupdate"));

          currentTime = 3;
          ended = true;
          video.dispatchEvent(new Event("ended"));
          document.documentElement.dataset.playbackEnded = "true";
        }, 0);
      });
    </script>
  </body>
</html>
